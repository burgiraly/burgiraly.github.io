<title>burgiraly</title>
<meta name="description" content="Burger- és sörszámláló, térkép és the list – a @burgiraly appja.">
<meta name="theme-color" content="#9c9e9d">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<link rel="manifest" href="manifest.webmanifest?v=2">

<meta name="application-name" content="burgiraly">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  /* ===== ARCULAT: nardo + cheddar =====
     Nardo Grey számláló · fekete lista és menü · Summit Gold gomb · ketchup piros csak elvétve */
  :root{
    --nardo:#9c9e9d; --nardo-mid:#8e9090; --black:#0d0d0d; --black-2:#1a1b1b; --line:#1e1e1e;
    --ink-soft:#353737; --cream:#ecedea; --knob:#c9cbca;
    --gold:#f5b51f; --ketchup:#c8102e;
    --bar:linear-gradient(90deg,var(--ketchup),#e2712a 45%,var(--gold));
    --display:"Bagel Fat One",system-ui,sans-serif;
    --thin:"Outfit",system-ui,sans-serif;
    --safe-b:env(safe-area-inset-bottom);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  /* nagyítás tiltása mindenhol (dupla koppintás is), kivéve a térképet */
  html,body,button,.view{touch-action:manipulation}
  #map,#map *{touch-action:none}
  html,body{margin:0;height:100%;background:var(--nardo);color:var(--black);font-family:var(--thin);font-weight:300;letter-spacing:-.01em}
  body{overflow:hidden}
  body.dark{background:var(--black)}
  button,input{font:inherit;color:inherit;letter-spacing:inherit}
  button{border:0;background:none;cursor:pointer}

  .view{position:fixed;inset:0;display:none;max-width:560px;margin:0 auto}
  .view.active{display:block}

  /* ---------- SZÁMLÁLÓ ---------- */
  #counter{background:var(--nardo)}
  .c-wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top) + clamp(20px, 6vh, 56px)) 0 calc(var(--safe-b) + 150px)}
  .hero{width:92px;height:92px;flex-shrink:0;display:grid;place-items:center}
  .hero canvas{width:92px;height:92px;image-rendering:pixelated}
  .hero .fallback{font-family:var(--display);font-size:15px}
  .meters{width:100%;flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
  .meters-in{width:100%;height:292px;max-height:100%;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none}
  .meters-in::-webkit-scrollbar{display:none}
  .meters-in.many{-webkit-mask-image:linear-gradient(#000 86%,transparent);mask-image:linear-gradient(#000 86%,transparent)}
  .m{height:146px;scroll-snap-align:start;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .lbl{font-size:13px;color:var(--ink-soft);display:flex;align-items:center;gap:6px}
  .del{font-size:13px;line-height:1;color:var(--ink-soft);opacity:.6;padding:2px 4px}
  .num{font-family:var(--display);font-size:56px;line-height:1;margin:4px 0 14px;font-variant-numeric:tabular-nums}
  .bar{position:relative;width:150px;height:3px}
  .bar i{position:absolute;inset:0;border-radius:9px;background:var(--bar);clip-path:inset(0 100% 0 0 round 9px);transition:clip-path .6s cubic-bezier(.2,.8,.2,1)}
  .bar svg{position:absolute;top:50%;left:0;width:7px;height:10px;margin:-5px 0 0 -3.5px;overflow:visible;transition:left .6s cubic-bezier(.2,.8,.2,1)}
  .bar polygon{fill:var(--knob);stroke:var(--black);stroke-width:1;stroke-linejoin:miter}
  .more{font-size:11px;color:var(--ink-soft);opacity:0;transition:opacity .2s;height:14px;margin-top:4px}
  .more.show{opacity:.8}

  .row{position:fixed;left:50%;transform:translateX(-50%);width:100%;max-width:560px;bottom:calc(var(--safe-b) + 88px);height:48px;display:flex;align-items:center;justify-content:center;padding:0 24px;z-index:20}
  .fab{position:absolute;left:24px;top:6px;width:36px;height:36px;border-radius:50%;border:1.5px solid var(--black);display:grid;place-items:center;font-size:20px;font-weight:300;line-height:1}
  .btn{width:168px;height:48px;border-radius:99px;background:var(--gold);border:1.5px solid var(--black);color:var(--black);font-weight:600;font-size:16px;transition:transform .1s}
  .btn:active,.fab:active{transform:scale(.96)}
  .row.hidden{display:none}

  /* ---------- MENÜ (lebegő buborék) ---------- */
  .nav{position:fixed;left:50%;bottom:calc(var(--safe-b) + 18px);transform:translateX(-50%);display:flex;gap:2px;padding:5px;border-radius:99px;background:var(--black);box-shadow:0 8px 24px rgba(0,0,0,.28);z-index:30}
  body.dark .nav{background:var(--black-2)}
  .nav button{padding:10px 16px;border-radius:99px;font-size:14px;color:var(--nardo-mid);white-space:nowrap;transition:background .2s,color .2s}
  .nav button.on{background:var(--gold);color:var(--black);font-weight:600}

  /* ---------- ABLAKOK ---------- */
  .veil{position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
  .veil.open{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:50%;bottom:0;width:100%;max-width:560px;max-height:85vh;overflow-y:auto;background:var(--black);color:var(--cream);border-radius:28px 28px 0 0;padding:12px 24px calc(var(--safe-b) + 24px);transform:translate(-50%,105%);transition:transform .3s cubic-bezier(.2,.9,.25,1);z-index:41}
  .sheet.open{transform:translate(-50%,0)}
  .grab{width:40px;height:4px;border-radius:9px;background:#333;margin:0 auto 16px}
  .sheet h2{font-family:var(--display);font-weight:400;font-size:22px;margin:0 0 8px;letter-spacing:0}
  .step{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-top:1px solid #222}
  .step-name{font-size:17px;font-weight:400;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ctrl{display:flex;align-items:center;gap:12px;flex-shrink:0}
  .round{width:42px;height:42px;border-radius:50%;border:1.5px solid #555;font-size:22px;display:grid;place-items:center;transition:transform .1s}
  .round:active{transform:scale(.92)}
  .round.plus{background:var(--gold);border-color:var(--gold);color:var(--black)}
  .qty{font-family:var(--display);font-size:28px;min-width:48px;text-align:center;font-variant-numeric:tabular-nums}
  .qty.neg{color:var(--ketchup)}
  .save{margin-top:16px;width:100%;height:52px;border-radius:99px;background:var(--gold);border:1.5px solid var(--gold);color:var(--black);font-weight:600;font-size:17px;transition:opacity .2s}
  .save:disabled{opacity:.35}
  .hint{font-size:13px;color:var(--nardo-mid);margin:0 0 6px}
  .field{width:100%;height:50px;border-radius:16px;border:1.5px solid #333;background:#161616;color:var(--cream);padding:0 16px;font-size:17px;outline:none}
  .field:focus{border-color:var(--gold)}

  .toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 150px);transform:translate(-50%,16px);background:var(--black);color:var(--cream);padding:11px 16px;border-radius:99px;font-size:14px;display:flex;gap:14px;align-items:center;opacity:0;pointer-events:none;transition:.25s;z-index:35;white-space:nowrap;max-width:calc(100% - 40px)}
  .toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
  #toast-text{overflow:hidden;text-overflow:ellipsis}
  .toast button{font-weight:600;color:var(--gold)}

  /* ---------- TÉRKÉP ---------- */
  #map-view{background:var(--black)}
  #map{position:absolute;inset:0;background:#1b1b1b}
  #map .leaflet-tile-pane{filter:grayscale(1) contrast(1.05) brightness(.95)}
  .map-top{position:absolute;top:calc(env(safe-area-inset-top) + 14px);left:0;right:0;z-index:500;display:flex;gap:6px;justify-content:center}
  .chip{background:rgba(13,13,13,.9);color:var(--nardo-mid);padding:9px 15px;border-radius:99px;font-size:14px;box-shadow:0 6px 18px rgba(0,0,0,.3)}
  .chip.on{background:var(--gold);color:var(--black);font-weight:600}
  .pin{width:30px;height:30px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);display:grid;place-items:center;border:1.5px solid var(--black);box-shadow:0 3px 8px rgba(0,0,0,.45)}
  .pin span{transform:rotate(45deg);font-family:var(--display);font-size:11px;color:var(--black)}
  .pin.closed{background:var(--knob)!important}
  .leaflet-popup-content-wrapper{background:var(--black);color:var(--cream);border-radius:18px}
  .leaflet-popup-tip{background:var(--black)}
  .leaflet-popup-content{margin:14px 16px;font-family:var(--thin);letter-spacing:-.01em}
  .leaflet-container a.leaflet-popup-close-button{color:var(--nardo-mid)}
  .pop-name{font-family:var(--display);font-size:19px;line-height:1.1}
  .pop-city{color:var(--nardo-mid);font-size:13px;margin:2px 0 10px}
  .pop-score{display:inline-block;font-family:var(--display);font-size:20px;padding:1px 9px;border:1.5px solid currentColor;border-radius:8px}
  .pop-avg{font-size:12px;color:var(--nardo-mid);margin-left:6px}
  .pop-list{margin:10px 0 0;padding:0;list-style:none;font-size:13px}
  .pop-list li{display:flex;justify-content:space-between;gap:12px;padding:3px 0;border-top:1px solid #222}
  .pop-badge{margin-top:8px;font-size:11px;font-weight:600;color:var(--ketchup)}
  .pop-ig{display:inline-block;margin-top:10px;color:var(--gold)!important;font-weight:600;font-size:13px}
  .pop-approx{font-size:11px;color:var(--nardo-mid);margin-top:6px}
  .map-msg{position:absolute;left:16px;right:16px;top:80px;z-index:600;background:var(--black);color:var(--nardo-mid);border-radius:16px;padding:14px 16px;font-size:14px}
  .leaflet-control-attribution{background:rgba(13,13,13,.7)!important;color:var(--nardo-mid)!important;font-size:10px}
  .leaflet-control-attribution a{color:var(--nardo-mid)!important}
  .leaflet-bottom.leaflet-right{bottom:calc(var(--safe-b) + 76px)}
  .leaflet-bar a{background:var(--black);color:var(--cream);border-color:#222}

  /* ---------- THE LIST ---------- */
  #list{background:var(--black);color:var(--cream);overflow-y:auto;padding-bottom:calc(var(--safe-b) + 100px)}
  .l-head{padding:calc(env(safe-area-inset-top) + 30px) 24px 20px;text-align:center}
  .kick{font-size:12px;color:var(--gold)}
  .l-head h1{font-family:var(--display);font-weight:400;font-size:clamp(38px,11vw,52px);line-height:.98;margin:8px 0 8px;letter-spacing:0}
  .l-head h1 em{font-style:normal;color:var(--gold)}
  .l-sub{font-size:13px;color:var(--nardo-mid)}
  .gigs{list-style:none;margin:0;padding:0}
  .gig{display:grid;grid-template-columns:30px 1fr auto;gap:12px;align-items:center;padding:13px 24px;border-top:1px solid var(--line)}
  .gig .n{font-family:var(--display);color:#3a3a3a;font-size:15px;font-variant-numeric:tabular-nums}
  .gig .t{font-family:var(--display);font-size:17px;line-height:1.12;word-break:break-word;letter-spacing:0}
  .gig .c{font-size:12px;color:var(--nardo-mid);margin-top:3px}
  .gig .s{font-family:var(--display);font-size:15px;padding:3px 9px;border:1.5px solid currentColor;border-radius:8px;white-space:nowrap}
  .stamp{font-size:11px;font-weight:600;color:var(--ketchup);margin-right:6px}
  .l-foot{text-align:center;font-size:12px;color:var(--nardo-mid);padding:22px 24px 0}

  /* ---------- FRISSÍTÉS ---------- */
  .upd{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 14px);transform:translate(-50%,-160%);background:var(--black);color:var(--cream);padding:8px 8px 8px 16px;border-radius:99px;font-size:14px;display:flex;gap:12px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.3);transition:transform .35s cubic-bezier(.2,.9,.25,1);z-index:60;white-space:nowrap}
  .upd.show{transform:translate(-50%,0)}
  .upd button{background:var(--gold);color:var(--black);font-weight:600;padding:7px 14px;border-radius:99px}
  .ver{font-size:11px;color:#4a4c4c;margin-top:10px;letter-spacing:.02em}
  .refresh{display:inline-block;margin-top:14px;font-size:13px;color:var(--nardo-mid);text-decoration:underline;text-underline-offset:3px}
  @media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>
</head>
<body>

<!-- SZÁMLÁLÓ -->
<section class="view active" id="counter">
  <div class="c-wrap">
    <div class="hero" id="hero" aria-label="beteszemaszamba"><span class="fallback">beteszemaszamba</span></div>
    <div class="meters"><div class="meters-in" id="meters"></div></div>
    <div class="more" id="more">görgess a többi számlálóért ↓</div>
  </div>
</section>

<!-- TÉRKÉP -->
<section class="view" id="map-view">
  <div id="map"></div>
  <div class="map-top">
    <button class="chip" data-fit="all">mind</button>
    <button class="chip on" data-fit="eu">európa</button>
    <button class="chip" data-fit="us">usa</button>
  </div>
</section>

<!-- THE LIST -->
<section class="view" id="list">
  <header class="l-head">
    <div class="kick">@burgiraly presents</div>
    <h1>The <em>Burger</em><br>World Tour</h1>
    <div class="l-sub" id="l-sub"></div>
  </header>
  <ol class="gigs" id="gigs"></ol>
  <div class="l-foot">beteszemaszamba · more dates tba<br><button class="refresh" id="refresh">app frissítése</button><div class="ver" id="ver"></div><div class="ver" id="diag"></div><div id="probe" style="position:fixed;top:0;left:0;width:0;height:0;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);visibility:hidden;pointer-events:none"></div></div>
</section>

<div class="row" id="row">
  <button class="fab" id="fab" aria-label="új számláló">+</button>
  <button class="btn" id="open">teddbeaszadba</button>
</div>

<nav class="nav">
  <button class="on" data-view="counter">számláló</button>
  <button data-view="map-view">térkép</button>
  <button data-view="list">the list</button>
</nav>

<div class="veil" id="veil"></div>
<div class="sheet" id="add-sheet" role="dialog" aria-modal="true" aria-label="hozzáadás">
  <div class="grab"></div>
  <h2>mit tettél a szádba?</h2>
  <div id="steps"></div>
  <button class="save" id="save" disabled>beteszemaszamba</button>
</div>
<div class="sheet" id="new-sheet" role="dialog" aria-modal="true" aria-label="új számláló">
  <div class="grab"></div>
  <h2>új számláló</h2>
  <p class="hint">mit szeretnél még számolni? pl. fröccs, hot dog, pizzaszelet</p>
  <input class="field" id="new-name" maxlength="20" placeholder="étel vagy ital neve" autocomplete="off">
  <button class="save" id="new-save" disabled>mentés</button>
</div>

<div class="upd" id="upd"><span>új verzió érhető el</span><button id="upd-go">frissítés</button></div>
<div class="toast" id="toast"><span id="toast-text"></span><button id="undo">vissza</button></div>

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// pontszám színe: ketchup piros (2,8) → narancs → Summit Gold (9,9)
function rateCol(sc){
  const t = Math.max(0, Math.min(1, (sc-2.8)/(9.9-2.8)));
  const S = [[0,[200,16,46]],[.45,[226,113,42]],[1,[245,181,31]]];
  for (let i=1;i<S.length;i++){ const [p1,c1]=S[i-1],[p2,c2]=S[i]; if (t<=p2){ const k=(t-p1)/(p2-p1); return `rgb(${c1.map((v,j)=>Math.round(v+(c2[j]-v)*k))})`; } }
}

const BASE = [{id:"burger",name:"burger"},{id:"beer",name:"beer"}];

const scaleMax = n => n >= 47 ? n + 3 : 50;
const KEY = "beteszemaszamba.v3";
let state = { custom:[], values:{} };
function load(){
  try{

  }catch(e){}
}
function persist(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
const counters = () => [...BASE, ...state.custom];
const val = id => state.values[id] || 0;

const KNOB = `<svg viewBox="-3.5 -5 7 10"><polygon points="-1.5,-4.5 1.5,-4.5 3,-3 3,3 1.5,4.5 -1.5,4.5 -3,3 -3,-3"/></svg>`;

function updateMeters(){
  $$(".m").forEach(el => {

let draft = {};
const showQty = q => q > 0 ? "+" + q : q < 0 ? "−" + Math.abs(q) : "0";
$("#open").onclick = () => {
  draft = {};
  $("#steps").innerHTML = counters().map(c => `
    <div class="step" data-id="${c.id}"><div class="step-name"></div>

  $$(".step").forEach(row => {
    const id = row.dataset.id;
    row.querySelector(".step-name").textContent = counters().find(c => c.id === id).name;
    row.querySelectorAll(".round").forEach(b => b.onclick = () => {
      draft[id] = Math.max(-val(id), Math.min(99, (draft[id]||0) + Number(b.dataset.d)));   // mínuszba is mehet, de 0 alá nem viszi a számlálót
      const q = row.querySelector(".qty"); q.textContent = showQty(draft[id]); q.classList.toggle("neg", draft[id] < 0);

};
let lastAdd = null, toastTimer = null;
$("#save").onclick = () => {
  const parts = [];
  lastAdd = {};
  counters().forEach(c => {
    const d = draft[c.id] || 0;
    if (!d) return;
    const before = val(c.id);
    state.values[c.id] = Math.max(0, before + d);
    lastAdd[c.id] = state.values[c.id] - before;
    parts.push(`${d > 0 ? "+" : "−"}${Math.abs(d)} ${c.name}`);
  });
  persist(); closeSheets();
  setTimeout(updateMeters, 150);
  toast(parts.join(", "));
};
function toast(text){

}

  if (!lastAdd) return;
  Object.entries(lastAdd).forEach(([id, d]) => state.values[id] = Math.max(0, val(id) - d));

  $("#toast").classList.remove("show");
};

function removeCounter(c){
  if (!confirm(`Törlöd a(z) „${c.name}” számlálót?`)) return;
  state.custom = state.custom.filter(x => x.id !== c.id);
  delete state.values[c.id];

}

const CYCLE = 2400, FRAMES = 24, PX = 56;
const ease = x => x<.5 ? 2*x*x : 1-Math.pow(-2*x+2,2)/2;
const span = (p,a,b) => Math.max(0, Math.min(1, (p-a)/(b-a)));
function pose(v, p){
  let h; if (p<.38) h = ease(span(p,0,.38)); else if (p<.6) h = 1-.04*Math.sin(span(p,.38,.6)*Math.PI*2); else h = 1-ease(span(p,.6,1));
  const m = p<.3 ? 0 : p<.4 ? ease(span(p,.3,.4)) : p<.56 ? 1 : p<.66 ? 1-ease(span(p,.56,.66)) : 0;
  return { x:v.down.x+(v.up.x-v.down.x)*h, y:v.down.y+(v.up.y-v.down.y)*h, r:v.down.r+(v.up.r-v.down.r)*h, m };
}
function applyPose(svg, v, p){
  const s = pose(v, p);
  svg.querySelector("#hand").setAttribute("transform", `translate(${s.x} ${s.y}) rotate(${s.r})`);
  svg.querySelector("#mouth-open").setAttribute("ry", (0.1 + s.m*7).toFixed(2));
  svg.querySelector("#teeth").setAttribute("opacity", s.m > .35 ? 1 : 0);
  svg.querySelector("#mouth-line").setAttribute("opacity", s.m > .15 ? 0 : 1);
  svg.querySelector("#eye-open").setAttribute("opacity", s.m > .55 ? 0 : 1);
  svg.querySelector("#eye-closed").setAttribute("opacity", s.m > .55 ? 1 : 0);
}

/* ---------- pixelesítés ---------- */
const PAL = [[13,13,13],[20,20,20],[33,23,15],[46,32,23],[74,54,40],[122,101,83],[58,15,12],[107,50,38],[195,143,105],[217,168,130],[236,200,165],[246,239,230],[90,52,32],[77,43,25],[185,112,47],[230,163,90],[245,181,31],[251,238,221]];
const nearest = (r,g,b) => { let best=PAL[0], d=1e9; for (const c of PAL){ const e=(c[0]-r)**2+(c[1]-g)**2+(c[2]-b)**2; if (e<d){ d=e; best=c; } } return best; };
async function frames(v){
  const holder = document.createElement("div"); holder.innerHTML = build(v);
  const svg = holder.firstElementChild; svg.setAttribute("width", PX); svg.setAttribute("height", PX);
  const out = [];
  for (let i=0;i<FRAMES;i++){
    applyPose(svg, v, i/FRAMES);
    const img = new Image(); img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(new XMLSerializer().serializeToString(svg)); await img.decode();
    const c = document.createElement("canvas"); c.width = c.height = PX; const g = c.getContext("2d"); g.drawImage(img,0,0,PX,PX);
    const d = g.getImageData(0,0,PX,PX), a = d.data;
    for (let k=0;k<a.length;k+=4){ if (a[k+3]<110){ a[k+3]=0; continue; } const [r,gg,b]=nearest(a[k],a[k+1],a[k+2]); a[k]=r; a[k+1]=gg; a[k+2]=b; a[k+3]=255; }
    g.putImageData(d,0,0); out.push(c);
  }
  return out;
}


/* ---------- zászló pixelenként ---------- */
const RED=[178,34,52], WHITE=[238,236,228], BLUE=[48,50,104];
function flagColor(u, v, px, py){
  if (u < .42 && v < 7/13){
    // csillagok: ritkított fehér pöttyök a kék mezőben
    return (px % 2 === 0 && py % 2 === 0) ? WHITE : BLUE;
  }
  return Math.floor(v*13) % 2 === 0 ? RED : WHITE;
}
// lay: { hoistX, dir(+1 jobbra / -1 balra), top, W, H, A, waves, pole, circle }
function drawFlag(ctx, lay, phase){
  const img = ctx.getImageData(0,0,PX,PX), d = img.data;
  const put = (x,y,c,k) => { if (x<0||y<0||x>=PX||y>=PX) return;
    if (lay.circle){ const dx=x+.5-lay.circle.x, dy=y+.5-lay.circle.y; if (dx*dx+dy*dy > lay.circle.r**2) return; }
    const i=(y*PX+x)*4; d[i]=c[0]*k; d[i+1]=c[1]*k; d[i+2]=c[2]*k; d[i+3]=255; };
  for (let c=0;c<lay.W;c++){
    const u = c/lay.W;
    const amp = lay.A * Math.pow(u, .7) + (lay.circle ? lay.A*.5 : 0);
    const ang = 2*Math.PI*lay.waves*u - phase;
    const off = Math.round(amp*Math.sin(ang));
    const slope = Math.cos(ang);
    const k = slope > .45 ? 1 : slope < -.45 ? .72 : .86;      // ráncok árnyéka 3 lépcsőben
    const x = lay.hoistX + lay.dir*c;
    for (let r=0;r<lay.H;r++) put(x, lay.top + r + off, flagColor(u, r/lay.H, c, r), k);
  }
  if (lay.pole){
    for (let y=lay.pole.top; y<PX; y++){ put(lay.pole.x, y, [70,70,68], 1); put(lay.pole.x+1, y, [110,110,106], 1); }
    put(lay.pole.x, lay.pole.top-1, [245,181,31], 1); put(lay.pole.x+1, lay.pole.top-1, [245,181,31], 1);
    put(lay.pole.x, lay.pole.top-2, [245,181,31], 1); put(lay.pole.x+1, lay.pole.top-2, [245,181,31], 1);
  }
  ctx.putImageData(img,0,0);
}
const HERO_FLAG = { hoistX:2, dir:1, top:5, W:52, H:30, A:1.8, waves:1.3 };
async function startHero(){
  try{
    const fig = await frames(V), out = [];
    for (let i=0;i<FRAMES;i++){
      const c = document.createElement("canvas"); c.width = c.height = PX; const g = c.getContext("2d");
      drawFlag(g, HERO_FLAG, 2*Math.PI*2*i/FRAMES); g.drawImage(fig[i],0,0); out.push(c);
    }
    const cv = document.createElement("canvas"); cv.width = cv.height = PX; const o = cv.getContext("2d");
    const hero = $("#hero"); hero.innerHTML = ""; hero.appendChild(cv);
    const still = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const draw = now => {
      const f = still ? out[0] : out[Math.floor(((now % CYCLE)/CYCLE) * FRAMES) % FRAMES];
      o.clearRect(0,0,PX,PX); o.drawImage(f,0,0);
      if (!still) requestAnimationFrame(draw);
    };
    requestAnimationFrame(draw);
  }catch(e){ /* ha valami nem megy, marad a felirat */ }
}

let map, groups = {}, tiles, tIdx = 0, tErr = 0;
function useTiles(i){
  if (tiles) map.removeLayer(tiles);
  tIdx = i; tErr = 0;
  tiles = L.tileLayer(TILES[i].url, TILES[i].opts).addTo(map);
  tiles.on("tileerror", () => { if (++tErr > 4 && tIdx < TILES.length-1) useTiles(tIdx+1); });

  if (typeof L === "undefined"){
    $("#map-view").insertAdjacentHTML("beforeend", '<div class="map-msg">A térkép nem töltődött be. Ellenőrizd az internetkapcsolatot, és frissítsd az oldalt.</div>');
    return;
  }
  map = L.map("map", { zoomControl:false }).setView([47.2,19.2], 7);
  L.control.zoom({ position:"bottomright" }).addTo(map);
  useTiles(0);
  const by = {};
  LIST.forEach(([text, score, pid]) => (by[pid] ||= []).push({ text, score }));
  const all = [], eu = [], us = [];
  Object.entries(by).forEach(([pid, items]) => {
    const p = PLACES[pid];
    if (!p) return;
    const locs = p.locs || (p.lat != null ? [{ lat:p.lat, lng:p.lng }] : []);
    if (!locs.length) return;
    const avg = items.reduce((a,b) => a + b.score, 0) / items.length, col = rateCol(avg);
    const icon = L.divIcon({ className:"", iconSize:[30,30], iconAnchor:[15,30], popupAnchor:[0,-26],
      html:`<div class="pin${p.closed?" closed":""}" style="background:${col}"><span>${avg.toFixed(1)}</span></div>` });
    const list = items.length > 1 ? `<ul class="pop-list">${items.map(it => `<li><span>${esc(it.text)}</span><b>${fmt(it.score)}</b></li>`).join("")}</ul>` : "";
    locs.forEach(loc => {
      const html = `<div class="pop-name">${esc(p.name)}</div><div class="pop-city">${esc(loc.label || p.city)}${p.locs ? ` · ${p.locs.length} helyszínből egy` : ""}</div>
        <span class="pop-score" style="color:${col}">${fmt(avg)}</span>${items.length>1?`<span class="pop-avg">${items.length} burger átlaga</span>`:""}
        ${list}${p.closed ? '<div class="pop-badge">bezárt</div>' : ""}
        ${p.ig ? `<div><a class="pop-ig" href="${esc(p.ig)}" target="_blank" rel="noopener">megnézem instán →</a></div>` : ""}
        ${p.approx ? '<div class="pop-approx">hozzávetőleges helyszín</div>' : ""}`;
      const m = L.marker([loc.lat, loc.lng], { icon }).bindPopup(html, { maxWidth:260 }).addTo(map);
      all.push(m.getLatLng()); (loc.lng < -30 ? us : eu).push(m.getLatLng());
    });
  });
  groups = { all, eu, us };
  map.whenReady(() => { map.invalidateSize(); fit("eu"); });
}
function fit(k){ const pts = groups[k]; if (map && pts && pts.length) map.fitBounds(L.latLngBounds(pts), { padding:[60,60], maxZoom:13 }); }
$$(".chip").forEach(c => c.onclick = () => { $$(".chip").forEach(x => x.classList.toggle("on", x === c)); fit(c.dataset.fit); });

/* =========================================================
   7) NAVIGÁCIÓ
   ========================================================= */
$$(".nav button").forEach(b => b.onclick = () => {
  const v = b.dataset.view;
  $$(".nav button").forEach(x => x.classList.toggle("on", x === b));
  $$(".view").forEach(s => s.classList.toggle("active", s.id === v));
  $("#row").classList.toggle("hidden", v !== "counter");
  document.body.classList.toggle("dark", v !== "counter");
  document.documentElement.style.background = v === "counter" ? "#9c9e9d" : v === "map-view" ? "#232323" : "#0d0d0d";
  document.querySelector('meta[name="theme-color"]').content = v === "counter" ? "#9c9e9d" : "#0d0d0d";
  $("#toast").classList.remove("show");
  if (v === "map-view") setTimeout(() => {
    initMap();
    if (map) { map.invalidateSize(); const on = document.querySelector(".chip.on"); fit(on ? on.dataset.fit : "eu"); }
  }, 60);
});

/* =========================================================
   8) NAGYÍTÁS TILTÁSA a térképen kívül (iOS csípés és dupla koppintás)
   ========================================================= */
const onMap = e => !!(e.target && e.target.closest && e.target.closest("#map"));
["gesturestart","gesturechange","gestureend"].forEach(t =>
  document.addEventListener(t, e => { if (!onMap(e)) e.preventDefault(); }, { passive:false }));
document.addEventListener("touchmove", e => { if (e.touches.length > 1 && !onMap(e)) e.preventDefault(); }, { passive:false });
let lastTouch = 0;
document.addEventListener("touchend", e => {
  const now = Date.now();
  if (now - lastTouch < 350 && !onMap(e)) {
    e.preventDefault();                                  // a gyors második koppintás ne nagyítson…
    const t = e.target.closest && e.target.closest("button");
    if (t && !t.disabled) t.click();                     // …de a gomb attól még működjön
  }
  lastTouch = now;
}, { passive:false });

/* =========================================================
   9) FRISSÍTÉS – új verzió figyelése, hogy ne kelljen újratelepíteni
   ========================================================= */
const APP_VERSION = "2026-10-13.8";
function hardReload(){ location.replace(location.pathname + "?v=" + Date.now()); }
$("#upd-go").onclick = hardReload;
$("#refresh").onclick = hardReload;
$("#ver").textContent = "verzió " + APP_VERSION;
function showDiag(){
  const cs = getComputedStyle($("#probe"));
  $("#diag").textContent = `ih ${innerHeight} · vv ${Math.round(window.visualViewport ? visualViewport.height : 0)} · sh ${screen.height} · t ${parseInt(cs.paddingTop)} · b ${parseInt(cs.paddingBottom)} · ${navigator.standalone ? "app" : "web"} · ${(navigator.userAgent.match(/OS (\d+[_\d]*)/)||["",""])[1].replace(/_/g,".")}`;
}
showDiag(); window.addEventListener("resize", showDiag);
async function checkUpdate(){
  try{
    const r = await fetch(location.pathname + "?check=" + Date.now(), { cache:"no-store" });
    const m = (await r.text()).match(/APP_VERSION = "([^"]+)"/);
    if (m && m[1] !== APP_VERSION) $("#upd").classList.add("show");
  }catch(e){ /* offline: nincs teendő */ }
}
checkUpdate();
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkUpdate(); });
if (/[?&]v=\d/.test(location.search)) history.replaceState(null, "", location.pathname);   // tiszta cím frissítés után

document.documentElement.style.background = "#9c9e9d";

load(); renderMeters(); renderList(); startHero();
</script>
</body>
</html>
